name: Tastatur-APK

on:
  push:
    paths:
      - "tastatur/**"
      - ".github/workflows/tastatur-apk.yml"
  pull_request:
    paths:
      - "tastatur/**"
      - ".github/workflows/tastatur-apk.yml"
  workflow_dispatch:

jobs:
  bauen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tastatur
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # Das Android-SDK ist auf ubuntu-latest vorinstalliert (ANDROID_HOME);
      # fehlende Plattformen laedt das Android-Gradle-Plugin selbst nach.
      - name: Tests und APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tastatur-debug-apk
          path: tastatur/app/build/outputs/apk/debug/app-debug.apk
